<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 리뷰</title>
<style>
  :root {
    --bg: #101216; --panel: #181b21; --panel2: #1f232b; --line: #2b303a;
    --text: #e9ecf1; --sub: #98a1b0; --dim: #6b7482;
    --accent: #ffb454; --accent-ink: #20170a; --done: #58c98b; --danger: #f0736a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 6px 12px; }
  button:hover { border-color: #414858; }
  button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  button.ghost { background: transparent; border-color: transparent; color: var(--sub); padding: 2px 6px; font-size: 13px; }
  button.ghost:hover { color: var(--text); background: var(--panel2); }

  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex: none; }
  header h1 { font-size: 16px; margin: 0; font-weight: 800; letter-spacing: -0.2px; white-space: nowrap; }
  header select { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 0; max-width: 420px; flex: 0 1 auto; }
  header .grow { flex: 1; }
  .state { color: var(--sub); font-size: 13px; white-space: nowrap; }
  .state b { color: var(--text); font-weight: 600; }

  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 14px 16px 12px; gap: 10px; }
  .videoBox { flex: 1; min-height: 0; background: #000; border-radius: 10px; overflow: hidden; display: flex; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }

  .track { position: relative; height: 26px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; flex: none; }
  .track .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #2a3040; border-radius: 7px 0 0 7px; pointer-events: none; }
  .track .pin { position: absolute; top: 3px; bottom: 3px; width: 6px; margin-left: -3px; border-radius: 3px; background: var(--accent); border: 0; padding: 0; }
  .track .pin.done { background: var(--done); opacity: .75; }
  .track .pin:hover { transform: scaleX(1.6); }
  .track .head { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: #fff; pointer-events: none; }

  .composer { display: flex; gap: 10px; align-items: stretch; flex: none; }
  .stamp { flex: none; width: 92px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .stamp .t { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stamp .l { font-size: 11px; color: var(--dim); }
  .stamp.locked { border-color: var(--accent); }
  .stamp.locked .t { color: var(--accent); }
  textarea { flex: 1; min-width: 0; resize: none; height: 64px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; line-height: 1.45; }
  textarea::placeholder { color: var(--dim); }
  .composer .primary { flex: none; width: 84px; }
  .hint { color: var(--dim); font-size: 12px; flex: none; display: flex; gap: 14px; flex-wrap: wrap; }
  kbd { background: var(--panel2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font: 11px/1.6 ui-monospace, Consolas, monospace; color: var(--sub); }

  aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; gap: 6px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); flex: none; align-items: center; }
  .tabs button { padding: 4px 10px; font-size: 13px; border-radius: 999px; }
  .tabs button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 700; }
  .tabs .saved { margin-left: auto; font-size: 12px; color: var(--dim); }
  .list { flex: 1; overflow-y: auto; padding: 8px; }
  .empty { color: var(--dim); text-align: center; padding: 40px 20px; font-size: 14px; }
  .item { border: 1px solid transparent; border-radius: 10px; padding: 10px 10px 8px; display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 4px 10px; cursor: pointer; }
  .item:hover { background: var(--panel2); }
  .item.near { border-color: #4a5163; background: var(--panel2); }
  .item .time { font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .item .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .item .ctx { grid-column: 2; font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .foot { grid-column: 2; display: flex; gap: 2px; align-items: center; min-height: 24px; }
  .item .foot .acts { margin-left: auto; opacity: 0; transition: opacity .12s; }
  .item:hover .acts, .item:focus-within .acts { opacity: 1; }
  .item.done .time { color: var(--done); }
  .item.done .body { color: var(--sub); }
  .badge { font-size: 12px; color: var(--dim); }
  .badge.done { color: var(--done); font-weight: 700; }
  .reply { grid-column: 2; font-size: 13px; color: #b9e6cd; background: rgba(88, 201, 139, .09); border-radius: 8px; padding: 6px 9px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .item textarea { grid-column: 2; height: 72px; }
  aside footer { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 13px; color: var(--sub); flex: none; }
  aside footer b { color: var(--text); }

  .gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 24px; }
  .gate .card { max-width: 520px; text-align: center; }
  .gate h2 { font-size: 22px; margin: 0 0 10px; letter-spacing: -0.3px; }
  .gate p { color: var(--sub); margin: 0 0 20px; }
  .gate .primary { font-size: 16px; padding: 12px 22px; }
  .gate .err { color: var(--danger); margin-top: 16px; min-height: 1.5em; }
  .gate code { background: var(--panel2); padding: 1px 6px; border-radius: 5px; color: var(--text); }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #2a2f3a; border: 1px solid #414858; border-radius: 10px; padding: 8px 10px 8px 14px; display: flex; gap: 10px; align-items: center; z-index: 20; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  [hidden] { display: none !important; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1.4fr) minmax(0, 1fr); } aside { border-left: 0; border-top: 1px solid var(--line); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <h1>영상 리뷰</h1>
  <select id="videoSel" aria-label="리뷰할 영상"></select>
  <button id="refresh" title="컨펌본 폴더를 다시 읽습니다">새로고침</button>
  <span class="grow"></span>
  <span class="state" id="counts"></span>
</header>

<main>
  <section class="stage">
    <div class="videoBox"><video id="v" controls preload="metadata"></video></div>
    <div class="track" id="track" title="누르면 그 시점으로 이동"><div class="fill" id="fill"></div><div class="head" id="head"></div></div>
    <div class="composer">
      <div class="stamp" id="stamp"><span class="t" id="stampT">0:00</span><span class="l" id="stampL">현재 시점</span></div>
      <textarea id="memo" placeholder="고칠 점을 적어 주세요. 입력을 시작하면 영상이 멈추고 그 시점이 함께 저장됩니다."></textarea>
      <button class="primary" id="add">저장</button>
    </div>
    <div class="hint">
      <span><kbd>Enter</kbd> 저장</span><span><kbd>Shift</kbd>+<kbd>Enter</kbd> 줄바꿈</span><span><kbd>Esc</kbd> 취소</span>
      <span><kbd>Space</kbd> 재생/정지</span><span><kbd>←</kbd><kbd>→</kbd> 5초</span><span><kbd>,</kbd><kbd>.</kbd> 한 프레임</span><span><kbd>M</kbd> 메모 쓰기</span>
    </div>
  </section>

  <aside>
    <div class="tabs" role="group" aria-label="목록 필터">
      <button data-f="all" aria-pressed="true">전체</button>
      <button data-f="open" aria-pressed="false">대기</button>
      <button data-f="done" aria-pressed="false">반영됨</button>
      <span class="saved" id="saved"></span>
    </div>
    <div class="list" id="list"></div>
    <footer>다 적었으면 편집 담당에게 <b>"피드백 반영해줘"</b>라고 말하세요.</footer>
  </aside>
</main>

<div class="gate" id="gate">
  <div class="card">
    <h2 id="gateTitle">리뷰 폴더를 연결해 주세요</h2>
    <p id="gateText">리뷰 폴더를 선택하면, 그 안의 <code>컨펌본</code> 영상을 재생하고 메모를 <code>피드백</code> 폴더에 저장합니다. 이 페이지는 이 컴퓨터 안에서만 동작하며 인터넷으로 아무것도 보내지 않습니다.</p>
    <button class="primary" id="gateBtn">리뷰 폴더 선택</button>
    <div class="err" id="gateErr" role="alert"></div>
  </div>
</div>

<div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastBtn">되돌리기</button></div>

<script>
(() => {
  'use strict';
  const CONFIRM = '컨펌본', FEEDBACK = '피드백';
  const VIDEO_EXT = /\.(mp4|mov|m4v|webm)$/i;
  const GUIDE = '영상 리뷰 메모. 편집 담당(AI 또는 사람): status가 open인 항목을 반영한 뒤 status를 "done"으로 바꾸고, reply에 무엇을 고쳤는지 한 줄, done_at에 시각, fixed_in에 새 파일명을 적는다. 반영하지 못한 항목은 open으로 두고 reply에 이유를 적는다. text, t, id는 바꾸지 않는다.';
  const $ = id => document.getElementById(id);
  const v = $('v'), memo = $('memo');

  const S = { root: null, confirmDir: null, fbDir: null, videos: [], cur: null, items: [], cues: [], filter: 'all',
              fbHandle: null, fbSeen: 0, lockT: null, wasPlaying: false, editing: null, url: null, undo: null };

  // ── 작은 도구
  const fmt = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + String(s).padStart(2, '0'); };
  const nowIso = () => { const d = new Date(), o = -d.getTimezoneOffset(), p = n => String(Math.abs(n)).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + (o >= 0 ? '+' : '-') + p(Math.floor(Math.abs(o) / 60)) + ':' + p(Math.abs(o) % 60); };
  const uid = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const base = name => name.replace(/\.[^.]+$/, '');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const typing = () => { const a = document.activeElement; return a && (a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.tagName === 'INPUT'); };

  // ── 폴더 핸들 기억 (IndexedDB)
  const idb = (mode, fn) => new Promise((res, rej) => { const r = indexedDB.open('video-review', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onerror = () => rej(r.error);
    r.onsuccess = () => { const tx = r.result.transaction('kv', mode), q = fn(tx.objectStore('kv')); tx.oncomplete = () => res(q.result); tx.onerror = () => rej(tx.error); }; });
  const remember = h => idb('readwrite', s => s.put(h, 'root')).catch(() => {});
  const recall = () => idb('readonly', s => s.get('root')).catch(() => null);

  // ── 연결
  function gate(title, text, btn, err) { $('gate').hidden = false; if (title) $('gateTitle').textContent = title; if (text) $('gateText').textContent = text; if (btn) $('gateBtn').textContent = btn; $('gateErr').textContent = err || ''; }

  async function connect(handle) {
    let conf;
    try { conf = await handle.getDirectoryHandle(CONFIRM); }
    catch (e) {
      // 컨펌본 폴더 자체를 고른 경우를 안내
      if (handle.name === CONFIRM) throw new Error('"컨펌본"이 아니라 그 바깥의 리뷰 폴더를 선택해 주세요.');
      throw new Error('이 폴더에는 "컨펌본" 폴더가 없습니다. 리뷰 폴더를 선택했는지 확인해 주세요.');
    }
    S.root = handle; S.confirmDir = conf; S.fbDir = await handle.getDirectoryHandle(FEEDBACK, { create: true });
    $('gate').hidden = true;
    await listVideos();
  }

  async function start() {
    if (new URLSearchParams(location.search).has('opfs')) { return connect(await navigator.storage.getDirectory()); } // 자동 시험용
    let framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
    if (framed) {   // Claude 채팅의 미리보기 창처럼 다른 페이지 안에 끼워진 상태에서는 폴더를 열 수 없다
      gate('여기서는 폴더를 열 수 없습니다', '지금 보시는 화면은 채팅 안의 미리보기입니다. 탐색기에서 리뷰 폴더의 "review.html" 파일을 더블클릭해 크롬이나 엣지로 직접 열어 주세요.');
      $('gateBtn').hidden = true; return;
    }
    if (!window.showDirectoryPicker) return gate('크롬이나 엣지에서 열어 주세요', '이 페이지는 폴더에 직접 저장하는 기능을 쓰기 때문에 Chrome 또는 Edge 브라우저가 필요합니다.', null, ''), $('gateBtn').hidden = true;
    const h = await recall();
    if (h) {
      let granted = false; try { granted = await h.queryPermission({ mode: 'readwrite' }) === 'granted'; } catch (e) {}
      if (granted) { try { return await connect(h); } catch (e) { gate(null, null, '리뷰 폴더 선택', e.message); $('gateBtn').onclick = pick; return; } }
      gate('다시 연결할까요?', '지난번에 쓰던 "' + h.name + '" 폴더를 다시 엽니다. 브라우저가 수정 허용을 물으면 허용을 눌러 주세요.', '폴더 다시 연결');
      $('gateBtn').onclick = async () => {
        let ok = false; try { ok = await h.requestPermission({ mode: 'readwrite' }) === 'granted'; } catch (e) {}
        if (!ok) return pick();
        try { await connect(h); } catch (e) { gate('리뷰 폴더를 연결해 주세요', null, '리뷰 폴더 선택', e.message); $('gateBtn').onclick = pick; }
      };
      return;
    }
    $('gateBtn').onclick = pick;
  }
  async function pick() {
    try { const h = await showDirectoryPicker({ id: 'video-review', mode: 'readwrite' }); await connect(h); await remember(h); }
    catch (e) { if (e.name !== 'AbortError') gate(null, null, '리뷰 폴더 선택', e.message); $('gateBtn').onclick = pick; }
  }

  // ── 영상 목록
  async function listVideos() {
    const out = [];
    for await (const [name, h] of S.confirmDir.entries()) {
      if (h.kind !== 'file' || !VIDEO_EXT.test(name)) continue;
      const f = await h.getFile(); out.push({ name, handle: h, mtime: f.lastModified, size: f.size });
    }
    out.sort((a, b) => b.mtime - a.mtime); S.videos = out;
    const sel = $('videoSel'); sel.textContent = '';
    if (!out.length) { sel.append(new Option('컨펌본 폴더에 영상이 없습니다', '')); S.cur = null; S.items = []; render(); return; }
    for (const x of out) { const d = new Date(x.mtime); sel.append(new Option(x.name + '  ·  ' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'), x.name)); }
    let want = S.cur && out.find(x => x.name === S.cur.name) ? S.cur.name : null;
    if (!want) { try { const last = localStorage.getItem('video-review-last'); if (last && out.find(x => x.name === last)) want = last; } catch (e) {} }
    sel.value = want || out[0].name;
    if (!S.cur || S.cur.name !== sel.value) await openVideo(sel.value);
  }

  async function openVideo(name) {
    const x = S.videos.find(q => q.name === name); if (!x) return;
    S.cur = x; S.editing = null; cancelMemo();
    try { localStorage.setItem('video-review-last', name); } catch (e) {}
    if (S.url) URL.revokeObjectURL(S.url);
    S.url = URL.createObjectURL(await x.handle.getFile()); v.src = S.url;
    S.cues = await loadCues(base(name));
    S.fbHandle = await S.fbDir.getFileHandle(base(name) + '.json', { create: true });
    await pull(true);
  }

  // ── 자막 파일(.srt)이 같은 이름으로 있으면, 메모 시점의 자막을 함께 적어 둔다
  async function loadCues(b) {
    try {
      const txt = await (await (await S.confirmDir.getFileHandle(b + '.srt')).getFile()).text(), cues = [];
      const sec = s => { const m = s.match(/(\d+):(\d+):(\d+)[,.](\d+)/); return m ? +m[1] * 3600 + +m[2] * 60 + +m[3] + +m[4] / 1000 : 0; };
      for (const blk of txt.replace(/\r/g, '').split(/\n\n+/)) {
        const L = blk.split('\n'), i = L.findIndex(l => l.includes('-->')); if (i < 0) continue;
        const [a, z] = L[i].split('-->'); cues.push({ a: sec(a), z: sec(z), text: L.slice(i + 1).join(' ').trim() });
      }
      return cues;
    } catch (e) { return []; }
  }
  const cueAt = t => { const c = S.cues.find(c => t >= c.a - 0.3 && t <= c.z + 0.3); return c ? c.text : ''; };

  // ── 피드백 파일 읽기/쓰기
  async function pull(force) {
    if (!S.fbHandle) return;
    const f = await S.fbHandle.getFile();
    if (!force && f.lastModified === S.fbSeen) return;
    S.fbSeen = f.lastModified;
    let data = null; try { const t = await f.text(); data = t.trim() ? JSON.parse(t) : null; } catch (e) { if (!force) return; } // 쓰는 도중이면 다음 번에 다시 읽음
    S.items = data && Array.isArray(data.items) ? data.items : [];
    render();
  }
  async function push() {
    S.items.sort((a, b) => a.t - b.t);
    const data = { _guide: GUIDE, video: S.cur.name, duration: Math.round((v.duration || 0) * 10) / 10, updated: nowIso(), items: S.items };
    const w = await S.fbHandle.createWritable(); await w.write(JSON.stringify(data, null, 2) + '\n'); await w.close();
    S.fbSeen = (await S.fbHandle.getFile()).lastModified;
    $('saved').textContent = '저장됨 ' + new Date().toTimeString().slice(0, 8);
    render();
  }
  // 바꾸기 직전에 디스크 최신본을 먼저 읽어, Claude가 적어 둔 체크 표시를 덮어쓰지 않는다
  async function change(fn) { try { await pull(false); fn(); await push(); } catch (e) { $('saved').textContent = '저장 실패: ' + e.message; } }

  // ── 메모 쓰기
  function lock() { if (S.lockT != null) return; S.wasPlaying = !v.paused; v.pause(); S.lockT = Math.round(v.currentTime * 10) / 10; stamp(); }
  function cancelMemo() { memo.value = ''; S.lockT = null; stamp(); }
  function stamp() { const on = S.lockT != null; $('stamp').classList.toggle('locked', on); $('stampT').textContent = fmt(on ? S.lockT : v.currentTime); $('stampL').textContent = on ? '이 시점에 저장' : '현재 시점'; }
  async function addMemo() {
    const text = memo.value.trim(); if (!text || !S.cur) return;
    const t = S.lockT != null ? S.lockT : Math.round(v.currentTime * 10) / 10, resume = S.wasPlaying;
    const it = { id: uid(), t, time: fmt(t), text, caption: cueAt(t), created: nowIso(), status: 'open', reply: '', done_at: null, fixed_in: null };
    cancelMemo();
    await change(() => S.items.push(it));
    const row = document.querySelector('[data-id="' + it.id + '"]'); if (row) row.scrollIntoView({ block: 'nearest' });
    if (resume) v.play().catch(() => {});
  }
  memo.addEventListener('input', () => { if (memo.value.trim()) lock(); else if (S.lockT != null) { S.lockT = null; stamp(); } });
  memo.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;               // 한글 조합 중 Enter는 무시
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addMemo(); }
    else if (e.key === 'Escape') { const r = S.wasPlaying && S.lockT != null; cancelMemo(); memo.blur(); if (r) v.play().catch(() => {}); }
  });
  $('add').onclick = addMemo;

  // ── 목록
  function seek(t) { v.currentTime = Math.max(0, t); v.pause(); }
  function render() {
    const open = S.items.filter(i => i.status !== 'done').length, done = S.items.length - open;
    $('counts').innerHTML = ''; $('counts').append('대기 ', el('b', null, String(open)), '  ·  반영됨 ', el('b', null, String(done)));
    const list = $('list'), keep = list.scrollTop; list.textContent = '';
    const shown = S.items.filter(i => S.filter === 'all' || (S.filter === 'done') === (i.status === 'done'));
    if (!shown.length) list.append(el('div', 'empty', !S.cur ? '컨펌본 폴더에 영상을 넣고 새로고침을 눌러 주세요.' : S.items.length ? '이 조건에 해당하는 메모가 없습니다.' : '아직 메모가 없습니다. 영상을 보다가 고칠 곳에서 바로 적어 보세요.'));
    for (const it of shown) {
      const isDone = it.status === 'done', row = el('div', 'item' + (isDone ? ' done' : '')); row.dataset.id = it.id; row.dataset.t = it.t; row.tabIndex = 0;
      row.append(el('div', 'time', fmt(it.t)));
      if (S.editing === it.id) {
        const ta = el('textarea'); ta.value = it.text; row.append(ta);
        const foot = el('div', 'foot'), ok = el('button', 'primary', '수정 저장'), no = el('button', 'ghost', '취소');
        const save = () => { const val = ta.value.trim(); S.editing = null; if (val && val !== it.text) change(() => { const q = S.items.find(q => q.id === it.id); if (q) { q.text = val; q.edited = nowIso(); } }); else render(); };
        ok.onclick = e => { e.stopPropagation(); save(); }; no.onclick = e => { e.stopPropagation(); S.editing = null; render(); };
        ta.onclick = e => e.stopPropagation();
        ta.onkeydown = e => { if (e.isComposing || e.keyCode === 229) return; if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); } else if (e.key === 'Escape') { S.editing = null; render(); } };
        foot.append(ok, no); row.append(foot); setTimeout(() => ta.focus(), 0);
      } else {
        row.append(el('div', 'body', it.text));
        if (it.caption) row.append(el('div', 'ctx', '자막: ' + it.caption));
        if (it.reply) row.append(el('div', 'reply', (isDone ? '✓ ' : '↩ ') + it.reply));
        const foot = el('div', 'foot'); foot.append(el('span', 'badge' + (isDone ? ' done' : ''), isDone ? '✓ 반영됨' + (it.fixed_in ? ' · ' + it.fixed_in : '') : '대기'));
        const acts = el('span', 'acts');
        if (isDone) { const b = el('button', 'ghost', '다시 요청'); b.title = '아직 마음에 들지 않으면 대기 상태로 되돌립니다'; b.onclick = e => { e.stopPropagation(); change(() => { const q = S.items.find(q => q.id === it.id); if (q) { q.status = 'open'; q.reopened = nowIso(); } }); }; acts.append(b); }
        const ed = el('button', 'ghost', '수정'), del = el('button', 'ghost', '삭제');
        ed.onclick = e => { e.stopPropagation(); S.editing = it.id; render(); };
        del.onclick = e => { e.stopPropagation(); change(() => { S.items = S.items.filter(q => q.id !== it.id); }).then(() => toast('메모를 삭제했습니다', () => change(() => S.items.push(it)))); };
        acts.append(ed, del); foot.append(acts); row.append(foot);
      }
      row.onclick = () => seek(it.t);
      row.onkeydown = e => { if (e.target === row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); seek(it.t); } };
      list.append(row);
    }
    list.scrollTop = keep; pins(); near();
  }
  function pins() {
    const tr = $('track'); tr.querySelectorAll('.pin').forEach(p => p.remove());
    const d = v.duration; if (!d) return;
    for (const it of S.items) { const p = el('button', 'pin' + (it.status === 'done' ? ' done' : '')); p.style.left = (it.t / d * 100) + '%'; p.title = fmt(it.t) + '  ' + it.text; p.setAttribute('aria-label', fmt(it.t) + ' 메모로 이동'); p.onclick = e => { e.stopPropagation(); seek(it.t); }; tr.append(p); }
  }
  function near() { const t = v.currentTime; document.querySelectorAll('.item').forEach(r => r.classList.toggle('near', Math.abs(+r.dataset.t - t) < 1.5)); }
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { S.filter = b.dataset.f; document.querySelectorAll('.tabs button').forEach(q => q.setAttribute('aria-pressed', q === b)); render(); });

  let toastTimer; function toast(text, undo) { $('toastText').textContent = text; $('toast').hidden = false; clearTimeout(toastTimer); $('toastBtn').onclick = () => { $('toast').hidden = true; undo(); }; toastTimer = setTimeout(() => $('toast').hidden = true, 6000); }

  // ── 재생 위치 표시와 단축키
  v.addEventListener('timeupdate', () => { const d = v.duration || 1, p = v.currentTime / d * 100; $('fill').style.width = p + '%'; $('head').style.left = p + '%'; if (S.lockT == null) stamp(); near(); });
  v.addEventListener('loadedmetadata', () => { pins(); stamp(); });
  $('track').onclick = e => { const r = $('track').getBoundingClientRect(); if (v.duration) v.currentTime = (e.clientX - r.left) / r.width * v.duration; };
  $('videoSel').onchange = e => openVideo(e.target.value);
  $('refresh').onclick = () => listVideos().then(() => pull(true));
  document.addEventListener('keydown', e => {
    if (typing() || e.ctrlKey || e.metaKey || e.altKey || !$('gate').hidden) return;
    const k = e.key, a = document.activeElement;
    if (a === v && (k === ' ' || k === 'ArrowLeft' || k === 'ArrowRight')) return;   // 영상에 초점이 있으면 브라우저 기본 동작에 맡김
    if (a && (a.tagName === 'BUTTON' || a.classList.contains('item')) && (k === ' ' || k === 'Enter')) return;
    if (k === ' ') { e.preventDefault(); v.paused ? v.play().catch(() => {}) : v.pause(); }
    else if (k === 'ArrowLeft') { e.preventDefault(); v.currentTime -= e.shiftKey ? 1 : 5; }
    else if (k === 'ArrowRight') { e.preventDefault(); v.currentTime += e.shiftKey ? 1 : 5; }
    else if (k === ',') { v.pause(); v.currentTime -= 1 / 30; }
    else if (k === '.') { v.pause(); v.currentTime += 1 / 30; }
    else if (k === 'm' || k === 'M' || k === 'ㅡ') { e.preventDefault(); memo.focus(); }
  });

  // Claude가 파일에 체크 표시를 하면 몇 초 안에 화면에 반영
  setInterval(() => { if (S.fbHandle && !S.editing && $('gate').hidden) pull(false).catch(() => {}); }, 4000);
  window.addEventListener('focus', () => { if (S.fbHandle && !S.editing) pull(false).catch(() => {}); });

  start().catch(e => gate(null, null, null, e.message));
})();
</script>
</body>
</html>
